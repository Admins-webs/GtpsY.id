<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout - GTPSY Store</title>
  <style>
    body {
      background: #1a1a1a;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #ff9900;
      text-align: center;
      margin-bottom: 20px;
    }

    .cart-item {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: 0 0 10px rgba(255,153,0,0.3);
      animation: slideIn 0.4s ease;
    }

    .cart-item h3 {
      margin: 0 0 5px;
    }

    .total {
      font-size: 18px;
      margin-top: 20px;
      text-align: right;
      font-weight: bold;
      color: #ff9900;
    }

    .wa-btn {
      display: block;
      background: #25d366;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
      border-radius: 10px;
      font-weight: bold;
      text-decoration: none;
      font-size: 16px;
      box-shadow: 0 0 10px rgba(37, 211, 102, 0.4);
      transition: transform 0.3s ease;
    }

    .wa-btn:hover {
      transform: scale(1.05);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>Checkout GTPSY Store</h1>
  <div id="cartContainer"></div>
  <div class="total" id="totalPrice">Total: Rp0</div>
  <a id="waCheckout" class="wa-btn" href="#" target="_blank">Checkout via WhatsApp</a>

  <script>
    const cart = JSON.parse(localStorage.getItem("gtpsyCart")) || [];
    const cartContainer = document.getElementById("cartContainer");
    const totalPriceEl = document.getElementById("totalPrice");
    const waCheckout = document.getElementById("waCheckout");

    let total = 0;
    let message = "Halo, saya ingin membeli produk berikut:%0A";

    cart.forEach(item => {
      const itemDiv = document.createElement("div");
      itemDiv.className = "cart-item";
      itemDiv.innerHTML = `<h3>${item.name}</h3><p>Harga: ${item.price}</p>`;
      cartContainer.appendChild(itemDiv);

      const harga = parseInt(item.price.replace("Rp", ""));
      total += harga;
      message += `- ${item.name} (${item.price})%0A`;
    });

    message += `%0ATotal: Rp${total.toLocaleString("id-ID")}`;
totalPriceEl.textContent = `Total: Rp${total.toLocaleString("id-ID")}`;
waCheckout.href = `https://wa.me/6282298334109?text=${message}`;
  <script>
    // Proteksi agar gak bisa buka inspect, klik kanan, dll
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.onkeydown = function(e) {
      if(e.keyCode == 123 || 
        (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) || 
        (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) || 
        (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) || 
        (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
          return false;
      }
    };
  </script>
</body>
</html>
