<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout - GTPSY Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #ff9900;
    }
    .product {
      background: #1e1e1e;
      margin: 10px 0;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 5px rgba(255, 153, 0, 0.4);
    }
    .total {
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
      color: #00ffcc;
    }
    .btn-wa {
      margin-top: 20px;
      display: block;
      background: #25d366;
      color: white;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    .btn-wa:hover {
      background: #1ebc5e;
    }
  </style>
</head>
<body>
  <h1>Checkout Produk</h1>
  <div id="checkoutItems"></div>
  <div class="total" id="totalPrice"></div>
  <a id="waCheckout" class="btn-wa" href="#" target="_blank">Kirim ke WhatsApp</a>

  <script>
    const cart = JSON.parse(localStorage.getItem("gtpsyCart")) || [];
    const checkoutItems = document.getElementById("checkoutItems");
    const totalPriceEl = document.getElementById("totalPrice");
    const waCheckout = document.getElementById("waCheckout");

    let total = 0;
    let message = "Halo Admin, saya ingin membeli produk berikut:%0A";

    cart.forEach(item => {
      const itemEl = document.createElement("div");
      itemEl.className = "product";
      itemEl.innerHTML = `<strong>${item.name}</strong><br>Harga: ${item.price}`;
      checkoutItems.appendChild(itemEl);

      const priceNumber = parseInt(item.price.replace(/[^\d]/g, ""));
      total += priceNumber;

      message += `%0A- ${item.name} (${item.price})`;
    });

    message += `%0A%0ATotal: Rp${total.toLocaleString("id-ID")}`;
    totalPriceEl.textContent = `Total: Rp${total.toLocaleString("id-ID")}`;
    waCheckout.href = `https://wa.me/6282298334109?text=${message}`;
  </script>
</body>
</html>
