<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GTPSY Store - Atha</title>
  <link rel="icon" href="https://freeimage.host/images/2025/04/05/37YzPMF.png" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: white;
      overflow-x: hidden;
    }

    header {
      background: #ff9900;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .product-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .product {
      background: #2a2a2a;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 12px rgba(255, 153, 0, 0.3);
      transition: transform 0.3s ease;
      animation: fadeIn 0.5s ease;
    }

    .product:hover {
      transform: scale(1.03);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .product h2 {
      margin: 0 0 10px;
      color: #ff9900;
    }

    .product p {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .buy-btn {
      display: inline-block;
      background: #ff9900;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .buy-btn:hover {
      background: #e67e00;
      transform: scale(1.05);
    }

    .cart-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #ff9900;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 0 15px rgba(255, 153, 0, 0.5);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .cart-btn:hover {
      transform: scale(1.1);
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 20px;
      }
    }

    #notif {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #333;
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
      display: none;
      z-index: 999;
    }
  </style>
</head>
<body>
  <header>
    <h1>GTPSY Store by Atha</h1>
  </header>

  <div class="product-list" id="productList"></div>
  <button class="cart-btn" onclick="goToCheckout()">Checkout</button>
  <div id="notif"></div>

  <script>
    const productList = document.getElementById("productList");
    const notif = document.getElementById("notif");
    const products = [
      "Magplant", "Rayman's Fist", "Vending Machine", "Diamond Lock", "Growtoken",
      "Gaia's Beacon", "Phoenix Wings", "Chandeliers", "Geiger Counter", "Ghost Charm",
      "Pepper Tree", "Legendary Bot", "World Lock", "Ancient Gear", "Ancestral Lens",
      "Riding Phoenix", "Devil Horns", "Golden Angel Wings", "Crystal Cape", "Growboard"
    ];

    const cart = [];

    function showNotif(message) {
      notif.textContent = message;
      notif.style.display = "block";
      setTimeout(() => notif.style.display = "none", 2500);
    }

    products.forEach((name, i) => {
      const price = 1000 * (i + 1);
      const item = document.createElement("div");
      item.className = "product";
      item.innerHTML = `
        <h2>${name}</h2>
        <p>Item eksklusif dari Growtopia</p>
        <p>Harga: Rp${price.toLocaleString()}</p>
        <a class="buy-btn" href="#" onclick="addToCart('${i}', '${name}', ${price})">Beli</a>
      `;
      productList.appendChild(item);
    });

    function addToCart(id, name, price) {
      cart.push({ id, name, price });
      showNotif(`${name} ditambahkan ke keranjang!`);
    }

    function goToCheckout() {
      if (cart.length === 0) {
        showNotif("Keranjang kamu kosong!");
        return;
      }
      localStorage.setItem("gtpsyCart", JSON.stringify(cart));
      window.location.href = "checkout.html";
    }
  </script>
</body>
</html>
